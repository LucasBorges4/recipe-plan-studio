    <div class="geos-tabs">

            type="email"
            id="login-email"
            placeholder="seu@email.com"
            required

            autofocus
          />
        </div>
        <div class="geos-field">
          <label for="login-password">Senha</label>
          <input
            type="password"
            id="login-password"
            placeholder="Sua senha"
            required

            <input type="text" id="reg-firstName" placeholder="João" required />
          </div>
          <div class="geos-field">
            <label for="reg-lastName">Sobrenome</label>
            <input type="text" id="reg-lastName" placeholder="Silva" required />
          </div>
        </div>
        <div class="geos-field">

          <input
            type="email"
            id="reg-email"
            placeholder="seu@email.com"
            required
            autocomplete="email"
          />

        <div class="geos-field">

          <input
            type="password"
            id="reg-password"
            placeholder="Mínimo 6 caracteres"

<script>
  (function () {
    var bg = document.querySelector(".geos-bg");
    var app = document.getElementById("app");
    var basePath = ((typeof window.BASE_PATH !== "undefined" ? window.BASE_PATH : "") || "").replace(/\/+$/, "");
    var registerUrl = basePath.replace(/\/$/, "") + "/rest/register";

    function readJson(r) {
      return r.text().then(function (t) {
        var d = null;
        try {
          d = t ? JSON.parse(t) : null;
        } catch (e) {
          d = null;
        }
        return { ok: r.ok, status: r.status, data: d };
      });
    }
    function apiError(r, fallback) {
      var d = r.data;
      return (d && (d.message || d.error)) || (r.status ? "HTTP " + r.status : fallback);
    }
    function netError(e) {
      return "Erro de conexão (" + ((e && e.message) || "rede indisponível") + ").";
    }

    /* Sonda de conectividade (endpoint anônimo 200, sem erro falso no console):
     se o próprio navegador bloqueia requisições (extensão, antivírus, proxy),
     avisa na hora em vez de falhar no login. */
    fetch(basePath + "/healthz", { method: "GET", cache: "no-store" })
      .then(function () {})
      .catch(function (e) {
        if (e && e.message === "Failed to fetch") {
          var w = document.getElementById("net-warn");
          if (w) {
            w.textContent =
              "Seu navegador ou antivírus está bloqueando as requisições deste site. Tente aba anônima ou libere este endereço no bloqueador/antivírus.";
            w.className = "geos-msg error";
          }
        }
      });

    function checkSession() {
      fetch(basePath + "/rest/login", { credentials: "include" })
        .then(readJson)
        .then(function (r) {
          var u = r.data && (r.data.data || r.data);
          if (r.ok && u && u.id) {
            document.body.classList.add("geos-authed");
            if (bg) bg.style.display = "none";
            if (app) app.style.display = "";
          }
        })
        .catch(function () {});
    }

    checkSession();

    var tabs = document.querySelectorAll(".geos-tab");
    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        tabs.forEach(function (t) {
          t.classList.remove("active");
        });
        document.querySelectorAll(".geos-panel").forEach(function (p) {
          p.classList.remove("active");
        });
        tab.classList.add("active");
        var panel = document.getElementById("panel-" + tab.getAttribute("data-tab"));
        if (panel) panel.classList.add("active");
        document.querySelectorAll(".geos-msg").forEach(function (m) {
          m.className = "geos-msg";
        });
      });
    });

    var loginForm = document.getElementById("geos-login-form");
    var loginBtn = document.getElementById("login-btn");
    var loginMsg = document.getElementById("login-msg");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      var password = document.getElementById("login-password").value;
      if (!email || !password) return;

      loginMsg.className = "geos-msg";
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="geos-spinner"></span> Entrando...';

      fetch(basePath + "/rest/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ emailOrLdapLoginId: email, password: password }),
      })
        .then(readJson)
        .then(function (r) {
          var u = r.data && (r.data.data || r.data);
          if (r.ok && u && u.id) {
            window.location.href = basePath + "/home/workflows";
          } else {
            loginMsg.textContent = apiError(r, "Credenciais inválidas.");
            loginMsg.className = "geos-msg error";
          }
          loginBtn.disabled = false;
          loginBtn.textContent = "Entrar";
        })
        .catch(function (e) {
          loginMsg.textContent = netError(e);
          loginMsg.className = "geos-msg error";
          loginBtn.disabled = false;
          loginBtn.textContent = "Entrar";
        });
    });

    var regForm = document.getElementById("geos-register-form");
    var regBtn = document.getElementById("reg-btn");
    var regMsg = document.getElementById("reg-msg");

    regForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var firstName = document.getElementById("reg-firstName").value.trim();
      var lastName = document.getElementById("reg-lastName").value.trim();
      var email = document.getElementById("reg-email").value.trim();
      var password = document.getElementById("reg-password").value;
      if (!email || !password || !firstName) return;

      regMsg.className = "geos-msg";
      regBtn.disabled = true;
      regBtn.innerHTML = '<span class="geos-spinner"></span> Criando conta...';

      fetch(registerUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          password: password,
          firstName: firstName,
          lastName: lastName,
        }),
      })
        .then(readJson)
        .then(function (r) {
          if (r.ok && r.data && r.data.ok) {
            regMsg.textContent = r.data.message || "Conta criada! Faça login.";
            regMsg.className = "geos-msg success";
            regForm.reset();
            setTimeout(function () {
              tabs[0].click();
              document.getElementById("login-email").value = email;
              document.getElementById("login-password").focus();
            }, 1500);
          } else {
            regMsg.textContent = apiError(r, "Erro ao criar conta.");
            regMsg.className = "geos-msg error";
          }
          regBtn.disabled = false;
          regBtn.textContent = "Criar Conta";
        })
        .catch(function (e) {
          regMsg.textContent = netError(e);
          regMsg.className = "geos-msg error";
          regBtn.disabled = false;
          regBtn.textContent = "Criar Conta";
        });
    });
  /* Conteúdo legal sincronizado com src/data/legal.ts do portal. */

        clauses: [

          },
          {

          },
          {

          },

    var legalModal = document.getElementById("geos-legal-modal");
    var legalClose = document.getElementById("legal-close");
    var legalOk = document.getElementById("legal-ok");

    function renderLegalDoc(key) {
      var doc = LEGAL_DOCS[key];
      if (!doc) return;
      document.getElementById("legal-title").textContent = doc.title;
      document.getElementById("legal-subtitle").textContent = doc.subtitle;
      document.getElementById("legal-version").textContent = "Versão " + doc.version;
      document.getElementById("legal-updated").textContent = "Atualizado em " + doc.updatedAt;
      document.getElementById("legal-intro").textContent = doc.intro;
      var wrap = document.getElementById("legal-clauses");
      wrap.innerHTML = "";
      doc.clauses.forEach(function (c) {
        var el = document.createElement("div");
        el.className = "geos-clause";
        var h = document.createElement("h3");
        h.textContent = c.title;
        var p = document.createElement("p");
        p.textContent = c.body;
        el.appendChild(h);
        el.appendChild(p);
        wrap.appendChild(el);
      });
      legalModal.classList.remove("hidden");
      document.querySelector(".geos-modal-body").scrollTop = 0;
    }

    function closeLegalModal() {
      legalModal.classList.add("hidden");
    }

    document.querySelectorAll(".geos-legal-link").forEach(function (link) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        renderLegalDoc(link.getAttribute("data-legal-doc"));
      });
    });
    if (legalClose) legalClose.addEventListener("click", closeLegalModal);
    if (legalOk) legalOk.addEventListener("click", closeLegalModal);
    legalModal.addEventListener("click", function (e) {
      if (e.target === legalModal) closeLegalModal();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !legalModal.classList.contains("hidden")) closeLegalModal();
    });
  })();
</script>
