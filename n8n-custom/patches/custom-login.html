<style>
  #app:not(:empty) { display: block !important; }
  #app:empty { display: none !important; }
  #custom-login-root { display: block; }
  #custom-login-root.hidden { display: none !important; }
  #custom-login-root * { margin: 0; padding: 0; box-sizing: border-box; }
  .geos-bg {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    inset: 0;
    z-index: 99999;
  }
  .geos-bg::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 50%, rgba(59,130,246,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .geos-card {
    width: 100%; max-width: 420px;
    background: #1e293b;
    border-radius: 16px;
    padding: 48px 40px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    border: 1px solid rgba(71,85,105,0.3);
    position: relative; z-index: 1;
    margin: 16px;
  }
  .geos-brand { text-align: center; margin-bottom: 32px; }
  .geos-logo {
    width: 64px; height: 64px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    overflow: hidden;
  }
  .geos-logo img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .geos-brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .geos-brand p { color: #94a3b8; font-size: 14px; }
  .geos-tabs {
    display: flex; gap: 0; margin-bottom: 28px;
    border-bottom: 2px solid #334155;
  }
  .geos-tab {
    flex: 1; padding: 10px;
    background: none; border: none;
    color: #94a3b8; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .geos-tab:hover { color: #f8fafc; }
  .geos-tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }
  .geos-field { margin-bottom: 18px; }
  .geos-row { display: flex; gap: 12px; }
  .geos-row .geos-field { flex: 1; }
  .geos-field label {
    display: block; font-size: 12px; font-weight: 600;
    color: #94a3b8; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .geos-field input {
    width: 100%; padding: 12px 14px;
    background: #334155; border: 1px solid #475569;
    border-radius: 10px; color: #f8fafc;
    font-size: 14px; transition: all 0.2s; outline: none;
  }
  .geos-field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .geos-field input::placeholder { color: #64748b; }
  .geos-btn {
    width: 100%; padding: 13px;
    background: #3b82f6; color: white; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; margin-top: 6px;
  }
  .geos-btn:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
  .geos-btn:active { transform: translateY(0); }
  .geos-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .geos-msg {
    display: none; font-size: 13px;
    text-align: center; margin-top: 12px; padding: 10px;
    border-radius: 8px;
  }
  .geos-msg.error {
    display: block; color: #f87171;
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.2);
  }
  .geos-msg.success {
    display: block; color: #4ade80;
    background: rgba(74,222,128,0.1);
    border: 1px solid rgba(74,222,128,0.2);
  }
  .geos-footer { text-align: center; margin-top: 20px; color: #64748b; font-size: 11px; }
  .geos-spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
    border-top-color: white; animation: geos-spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes geos-spin { to { transform: rotate(360deg); } }
  .geos-panel { display: none; }
  .geos-panel.active { display: block; }
  @media (max-width: 480px) {
    .geos-card { padding: 32px 24px; }
    .geos-brand h1 { font-size: 20px; }
    .geos-row { flex-direction: column; gap: 0; }
  }
</style>
<div class="geos-bg">
  <div class="geos-card">
    <div class="geos-brand">
      <div class="geos-logo"><img src="/logo.jpg" alt="Grupo Geos" /></div>
      <h1>Grupo Geos</h1>
      <p>Automação de Processos</p>
    </div>

    <div class="geos-tabs">
      <button class="geos-tab active" data-tab="login">Entrar</button>
      <button class="geos-tab" data-tab="register">Criar Conta</button>
    </div>

    <!-- LOGIN -->
    <div class="geos-panel active" id="panel-login">
      <form id="geos-login-form">
        <div class="geos-field">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email" autofocus />
        </div>
        <div class="geos-field">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="Sua senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="geos-btn" id="login-btn">Entrar</button>
        <div class="geos-msg" id="login-msg"></div>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="geos-panel" id="panel-register">
      <form id="geos-register-form">
        <div class="geos-row">
          <div class="geos-field">
            <label for="reg-firstName">Nome</label>
            <input type="text" id="reg-firstName" placeholder="João" required />
          </div>
          <div class="geos-field">
            <label for="reg-lastName">Sobrenome</label>
            <input type="text" id="reg-lastName" placeholder="Silva" required />
          </div>
        </div>
        <div class="geos-field">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" placeholder="seu@email.com" required autocomplete="email" />
        </div>
        <div class="geos-field">
          <label for="reg-password">Senha</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="geos-btn" id="reg-btn">Criar Conta</button>
        <div class="geos-msg" id="reg-msg"></div>
      </form>
    </div>

    <div class="geos-footer">Automação de processos — Grupo Geos</div>
  </div>
</div>

<script>
(function() {
  var bg = document.querySelector('.geos-bg');
  var app = document.getElementById('app');
  var basePath = (typeof window.BASE_PATH !== 'undefined' ? window.BASE_PATH : '') || '';
  var registerUrl = basePath.replace(/\/$/, '') + '/rest/register';

  /* Session check — only if cookie exists */
  if (document.cookie.indexOf('n8n-auth=') !== -1) {
    fetch(basePath + '/rest/login', {credentials: 'include'})
      .then(function(r) {
        if (r.ok) return r.json();
        throw new Error('not logged in');
      })
      .then(function(d) {
        if (d && d.data && d.data.id) {
          if (bg) bg.style.display = 'none';
          if (app) app.style.display = '';
        }
      })
      .catch(function() {});
  }

  /* Tab switching */
  var tabs = document.querySelectorAll('.geos-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.geos-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById('panel-' + tab.getAttribute('data-tab'));
      if (panel) panel.classList.add('active');
      /* Clear messages */
      document.querySelectorAll('.geos-msg').forEach(function(m) { m.className = 'geos-msg'; });
    });
  });

  /* LOGIN */
  var loginForm = document.getElementById('geos-login-form');
  var loginBtn = document.getElementById('login-btn');
  var loginMsg = document.getElementById('login-msg');

  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    if (!email || !password) return;

    loginMsg.className = 'geos-msg';
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="geos-spinner"></span> Entrando...';

    fetch(basePath + '/rest/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ emailOrLdapLoginId: email, password: password })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(r) {
      if (r.ok && r.data && r.data.id) {
        window.location.href = basePath + '/';
      } else {
        loginMsg.textContent = (r.data && r.data.message) || 'Credenciais inválidas.';
        loginMsg.className = 'geos-msg error';
      }
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
    })
    .catch(function() {
      loginMsg.textContent = 'Erro de conexão.';
      loginMsg.className = 'geos-msg error';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
    });
  });

  /* REGISTER */
  var regForm = document.getElementById('geos-register-form');
  var regBtn = document.getElementById('reg-btn');
  var regMsg = document.getElementById('reg-msg');

  regForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var firstName = document.getElementById('reg-firstName').value.trim();
    var lastName = document.getElementById('reg-lastName').value.trim();
    var email = document.getElementById('reg-email').value.trim();
    var password = document.getElementById('reg-password').value;
    if (!email || !password || !firstName) return;

    regMsg.className = 'geos-msg';
    regBtn.disabled = true;
    regBtn.innerHTML = '<span class="geos-spinner"></span> Criando conta...';

    fetch(registerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password, firstName: firstName, lastName: lastName })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(r) {
      if (r.ok && r.data && r.data.ok) {
        regMsg.textContent = r.data.message || 'Conta criada! Faça login.';
        regMsg.className = 'geos-msg success';
        regForm.reset();
        /* Switch to login tab after 1.5s */
        setTimeout(function() {
          tabs[0].click();
          document.getElementById('login-email').value = email;
          document.getElementById('login-password').focus();
        }, 1500);
      } else {
        regMsg.textContent = (r.data && r.data.error) || 'Erro ao criar conta.';
        regMsg.className = 'geos-msg error';
      }
      regBtn.disabled = false;
      regBtn.textContent = 'Criar Conta';
    })
    .catch(function() {
      regMsg.textContent = 'Erro de conexão.';
      regMsg.className = 'geos-msg error';
      regBtn.disabled = false;
      regBtn.textContent = 'Criar Conta';
    });
  });
})();
</script>
