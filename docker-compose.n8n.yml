services:
  n8n-recipe:
    build:
      context: ./n8n-custom
      dockerfile: Dockerfile
    image: n8n-custom-geos:latest
    container_name: n8n-recipe
    restart: unless-stopped
    ports:
      - "5679:5678"
      - "3456:3456"
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-32chars-please}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-${N8N_PUBLIC_URL:-}}
      PORTAL_PG_HOST: ${PORTAL_PG_HOST:-163.176.45.217}
      PORTAL_PG_PORT: ${PORTAL_PG_PORT:-5433}
      PORTAL_PG_DATABASE: ${PORTAL_PG_DATABASE:-portal}
      PORTAL_PG_USER: ${PORTAL_PG_USER:-portal}
      PORTAL_PG_PASSWORD: ${PORTAL_PG_PASSWORD:-}
      AUTH_PEPPER: ${AUTH_PEPPER:-}
    volumes:
      - n8n_recipe_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_recipe_data:
    name: n8n_recipe_data
