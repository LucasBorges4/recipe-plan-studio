services:
  postgres-portal:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_strong_2024}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
      - ./.data/pg-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portal_pgdata:
    name: portal_pgdata
